<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DepotKompass - Dein Vermögen im Blick</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#f8fafc;color:#0f172a}
header{background:#0f172a;color:#fff;padding:24px;text-align:center}
.wrap{max-width:980px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.card{background:#fff;border-radius:16px;padding:18px;border:1px solid #e2e8f0}
.card small{color:#64748b;font-size:11px}
.card b{font-size:24px;display:block}
.broker b{color:#2563eb}
.aktien b{color:#16a34a}
.top{background:#fff;border-radius:16px;margin-top:20px;padding:18px;border:1px solid #e2e8f0}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9}
</style>
</head>
<body>
<header><h1>🧭 DepotKompass</h1><p>Dein Vermögen im Blick</p></header>
<div class="wrap">
<div class="grid">
<div class="card"><small>Gesamtvermögen</small><b>€ 87.420</b></div>
<div class="card broker"><small>Broker</small><b>Trade Republic</b></div>
<div class="card aktien"><small>Aktien</small><b>23 Positionen</b></div>
<div class="card"><small>Rendite</small><b style="color:#16a34a">+8,4%</b></div>
</div>
<div class="top"><h2>Top 10</h2>
<div class="row"><span>MSCI World</span><span>€ 24.500</span></div>
<div class="row"><span>NVIDIA</span><span>€ 11.200</span></div>
<div class="row"><span>Apple</span><span>€ 8.900</span></div>
</div>
</div>
</body>
</html>
