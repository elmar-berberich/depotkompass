<style>
.kreis-section { background: white; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 20px; margin-top: 20px; }
.kreis-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 768px) { .kreis-grid { grid-template-columns: 1fr 1fr 1fr; } }
.kreis-card { border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; padding: 16px; }
.kreis-title { font-size: 16px; font-weight: 800; letter-spacing: 0.02em; text-transform: none; opacity: 1; margin-bottom: 16px; color: #111827; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
(function(){
  function renderKreis() {
    try {
      let holdingsRaw = localStorage.getItem("depot_v36_holdings");
      if(!holdingsRaw) return;
      let holdings = JSON.parse(holdingsRaw);
      if(!Array.isArray(holdings) || holdings.length===0) return;
      
      let brokerNamesRaw = localStorage.getItem("depot_v36_brokerNames");
      let brokerNames = {TR:"Trade Republic", SB:"Smartbroker+"};
      try { if(brokerNamesRaw) brokerNames = JSON.parse(brokerNamesRaw); } catch(e){}
      
      // Aggregate by broker
      let byBroker = {};
      holdings.forEach(h=>{
        let b = h.broker || "Unknown";
        let name = b==="TR" ? brokerNames.TR : b==="SB+" ? brokerNames.SB : b;
        byBroker[name] = (byBroker[name]||0) + (h.wert||0);
      });
      
      // Aggregate by typ
      let byTyp = {};
      holdings.forEach(h=>{
        let t = h.typ || "Sonstige";
        byTyp[t] = (byTyp[t]||0) + (h.wert||0);
      });
      
      // Top 10 positions
      let sorted = [...holdings].sort((a,b)=> (b.wert||0)-(a.wert||0)).slice(0,10);
      
      // Helper to draw
      const drawPie = (canvasId, labels, data, colors) => {
        let canvas = document.getElementById(canvasId);
        if(!canvas) return;
        let existing = Chart.getChart(canvas);
        if(existing) existing.destroy();
        // Mitte grün, links blau - Unterschied sichtbar
        let bg;
        if(canvasId==='kreisTyp'){
          bg = ['#15803D','#86EFAC']; // dunkelgrün + hellgrün
        } else if(canvasId==='kreisBroker'){
          bg = ['#1E40AF','#60A5FA']; // blau
        } else {
          bg = colors || ['#1E40AF','#60A5FA'];
        }
        new Chart(canvas, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: data,
              backgroundColor: bg,
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: { position: 'top', labels: { font: { size: 12, weight: '700' }, boxWidth: 14, boxHeight:14, padding: 16, color: '#111827' } },
              tooltip: { callbacks: { label: (ctx)=>{ let v=ctx.parsed; let total=ctx.dataset.data.reduce((a,b)=>a+b,0); let pct=((v/total)*100).toFixed(1); return ctx.label + ': ' + v.toLocaleString('de-DE',{minimumFractionDigits:2}) + '€ ('+pct+'%)' } } }
            }
          }
        });
      };
      
      drawPie('kreisBroker', Object.keys(byBroker), Object.values(byBroker), ['#1E40AF','#60A5FA']);
      drawPie('kreisTyp', Object.keys(byTyp), Object.values(byTyp), ['#2563EB','#93C5FD']);
      
      // Top10 as BAR chart gray/blue
      (function(){
        let c = document.getElementById('kreisTop10');
        if(!c) return;
        // Change canvas container height for bar
        c.parentElement.style.height = '300px';
        let ex = Chart.getChart(c);
        if(ex) ex.destroy();
        new Chart(c, {
          type: 'bar',
          data: {
            labels: sorted.map(h=>h.name.length>22?h.name.slice(0,22)+'…':h.name),
            datasets: [{ data: sorted.map(h=>h.wert), backgroundColor: ['#7FB8D6','#F4A6A0','#8BC99B','#FFD07A','#A99BC7','#7EC8A0','#FFB88C','#A8D5A2','#FF9AA2','#8EC9E8'], borderRadius:6, barThickness:14 }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 1400, easing: 'easeOutQuart', delay: (ctx)=>ctx.dataIndex*80 },
            plugins: { legend:{display:false}, tooltip:{ backgroundColor:'#111827', callbacks:{ label:(ctx)=>' '+ctx.parsed.x.toLocaleString('de-DE',{minimumFractionDigits:2})+'€' } } },
            scales: { x:{ grid:{color:'#f1f5f9'}, ticks:{ font:{size:9}, color:'#6B7280', callback:(v)=>(v/1000).toFixed(0)+'k€' } }, y:{ grid:{display:false}, ticks:{ font:{size:9}, color:'#374151' } } }
          }
        });
      })();

      
      // Show section
      let sec = document.getElementById('kreisdiagrammeSection');
      if(sec) sec.style.display = 'block';
    } catch(e){ console.error('Kreis render error', e); }
  }
  
  // Inject HTML for charts after positions
  function injectSection() {
    if(document.getElementById('kreisdiagrammeSection')) return;
    // Find positions table container - look for POSITIONEN text
    let posHeaders = Array.from(document.querySelectorAll('*')).filter(el=>el.textContent && el.textContent.trim()==='POSITIONEN');
    let anchor = posHeaders.length>0 ? posHeaders[0].closest('div').parentElement : null;
    // Fallback: append to body
    if(!anchor) anchor = document.body;
    
    let section = document.createElement('div');
    section.id = 'kreisdiagrammeSection';
    section.className = 'kreis-section';
    section.style.display = 'none';
    section.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div class="kreis-title" style="margin:0; font-size:12px;">KREISDIAGRAMME • Verteilung</div>
        <button id="kreisRefresh" style="font-size:10px; border:1px solid rgba(0,0,0,0.15); border-radius:6px; padding:4px 10px; background:white;">Aktualisieren</button>
      </div>
      <div class="kreis-grid">
        <div class="kreis-card">
          <div class="kreis-title">Broker</div>
          <canvas id="kreisBroker" height="220"></canvas>
        </div>
        <div class="kreis-card">
          <div class="kreis-title">Aktien / ETFs</div>
          <canvas id="kreisTyp" height="220"></canvas>
        </div>
        <div class="kreis-card">
          <div class="kreis-title">Top Ten</div>
          <div style="height:320px;"><canvas id="kreisTop10"></canvas></div>
        </div>
      </div>
      <div style="margin-top:12px; font-size:9px; opacity:0.5;">Quelle: depot_v36_holdings aus localStorage • TR + SB kombiniert</div>
    `;
    // Insert after the main content div - find min-h-screen
    let mainDiv = document.querySelector('.min-h-screen');
    if(mainDiv) {
      mainDiv.appendChild(section);
    } else {
      document.body.appendChild(section);
    }
    
    let btn = document.getElementById('kreisRefresh');
    if(btn) btn.addEventListener('click', renderKreis);
  }
  
  // Try to inject after page load
  function init() {
    injectSection();
    setTimeout(renderKreis, 1000);
    // Re-render when holdings change (listen to localStorage via interval)
    setInterval(renderKreis, 3000);
  }
  
  if(document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  
  // Also add a button in header to scroll to charts
  setTimeout(()=>{
    try {
      let header = document.querySelector('header') || document.querySelector('.bg-black');
      if(header) {
        let btn = document.createElement('button');
        btn.textContent = '◉ Diagramme';
        btn.style.cssText = 'margin-left:12px; font-size:10px; border:1px solid rgba(255,255,255,0.2); border-radius:6px; padding:4px 10px; color:white; background:transparent; cursor:pointer;';
        btn.onclick = () => {
          let sec = document.getElementById('kreisdiagrammeSection');
          if(sec) sec.scrollIntoView({behavior:'smooth'});
        };
        header.appendChild(btn);
      }
    } catch(e){}
  }, 1500);
})();
</script>
</body>
